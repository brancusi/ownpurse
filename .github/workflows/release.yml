name: release
# Publishes a GitHub Release as soon as a version tag is pushed. It does not wait on the gate or CI: during rapid
# development `rust/scripts/release.sh` is the release path and CI reports separately.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        run: |
          v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
      - name: Changelog section
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "No changelog section for $v." > notes.md
      - name: GitHub Release (source; install with ./install.sh)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
