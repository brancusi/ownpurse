<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ownpurse admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/admin/admin.css">
  <!-- The theme before the first paint, so a dark system never flashes light; main.cljs keeps it following. -->
  <script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"</script>
</head>
<body>
  <div id="app">
    <p style="font-family: sans-serif; padding: 24px">The admin is not built yet. In the ownpurse checkout, run
      <code>bin/admin build</code> (once) or <code>bin/admin dev</code> (while changing it), then reload.</p>
  </div>
  <script src="/admin/js/main.js"></script>
</body>
</html>
