[workspace]
resolver = "2"
members = ["crates/ownpurse-core", "crates/ownpurse-cli", "crates/ownpurse-tui", "crates/ownpurse-xero", "xtask"]

[workspace.package]
version = "0.16.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std", "serde-str"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
unicode-segmentation = "1"
sha2 = "0.11"
# intercompany party rules are case-insensitive regex searches from config; needs a regex engine
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
# manifests: every change is an RFC 6902 JSON Patch against a normalised document (diff + apply)
json-patch = { version = "4", default-features = false, features = ["diff"] }
# word-level highlights inside changed text fields (already in the tree through insta)
similar = "2"
# overlays (hints, rings, spotlights) and walkthroughs: placement and tracking over the TUI's own drawing; pure,
# no I/O (an exact local export; see caretline.rev and scripts/prepare-caretline.sh)
caretline-layers = { path = "../vendor/caretline/crates/caretline-layers", default-features = false }
caretline-tour = { path = "../vendor/caretline/crates/caretline-tour", default-features = false }
insta = "1"
proptest = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.clippy]
float_arithmetic = "deny"

# Smaller dev and test builds: file:line in backtraces for our crates, no debug info for dependencies
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
