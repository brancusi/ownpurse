[package]
name = "ownpurse-cli"
description = "ownpurse command line (read commands)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ownpurse"
path = "src/main.rs"

[dependencies]
ownpurse-core = { path = "../ownpurse-core" }
# the network commands (sync, login, orgs); never a dependency of the TUI
ownpurse-xero = { path = "../ownpurse-xero" }
clap.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
# Already in the workspace via core: `Record::conn()` hands out the read-only rusqlite connection, and the
# CLI runs its read-only queries (sync freshness, usage, show) through it.
rusqlite.workspace = true
# `manifest add --patch`: an RFC 6902 patch file applied to the current document
json-patch.workspace = true
# `ui flash` restores the overlay on Ctrl-C: a SIGINT flag (std has no signal API)
libc = "0.2"

[dev-dependencies]
png = "0.18"
serde.workspace = true

[lints]
workspace = true
