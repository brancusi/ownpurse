[package]
name = "ownpurse-core"
description = "ownpurse core: the local record, exact-decimal ledger, bases, parity, intercompany, compare"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
rust_decimal.workspace = true
regex.workspace = true
# classify: the store's hash chain and fingerprints (same SHA-256 as the record's chain)
sha2.workspace = true
# write: the precondition diff; manifests: RFC 6902 JSON Patch (diff and apply) over normalised documents
json-patch.workspace = true
# classify: `classify.toml`, edited format-preserving (hand comments survive TUI and agent writes)
toml_edit = "0.25"
# the agent bridge (`bridge`): kill(pid, 0) for stale sessions and flock on the registry
libc = "0.2"
# `raster`: the TUI's cell grid as a PNG (`ui screen --format png`, `ownpurse-tui --state … --format png`);
# see docs/ARCHITECTURE.md (dependencies) for why these two and not an SVG renderer
fontdue = { version = "0.9", default-features = false, features = ["hashbrown"] }
png = "0.18"
# walkthroughs: caretline-tour (the file format, its strict parser and lint, the step reducer; pure)
caretline-tour.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "classify"
harness = false

[[bench]]
name = "classify_open"
harness = false

[lints]
workspace = true
