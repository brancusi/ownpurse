[package]
name = "ownpurse-tui"
description = "ownpurse terminal UI (read-only; cannot depend on any write crate: invariant V1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ownpurse-tui"
path = "src/main.rs"

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "classify"
harness = false

[dependencies]
ownpurse-core = { path = "../ownpurse-core" }
ratatui.workspace = true
crossterm.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
rust_decimal.workspace = true
serde_json.workspace = true
# the view state (`state::ViewState`) serialises with derive; already in the tree through core
serde.workspace = true
# SIGTERM/SIGHUP restore the terminal (spec §8): std has no signal API; a flag set from the handler.
libc = "0.2"
# v0.12.0 user config (keys.toml, themes/*.toml): the same spanned TOML parser as classify.toml (in core
# already), and the same SHA-256 as the record's chain for the revision hash
toml_edit = "0.25"
sha2.workspace = true
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# manifests: word-level highlights inside changed text fields of the generic diff view (already in the tree
# through insta)
similar.workspace = true
# overlays: hint/ring/spotlight placement over the anchors this crate records while drawing (pure; serde only)
caretline-layers.workspace = true
caretline-tour.workspace = true

[dev-dependencies]
# manifest tests: a temp copy of the demo record gets approvals, write attempts and read-backs
rusqlite.workspace = true
insta.workspace = true
criterion.workspace = true

[lints]
workspace = true
