# Demo classification config (the Brackenridge group). Generated by `cargo run -p xtask -- demo fixtures`.
version = 1

[jev]
enabled = false            # Jev is not available in v0.11.0
fields  = ["description", "payee", "amount", "date"]

[label_types.project]
title   = "Project"
choices = [
  { id = "harvest", name = "Harvest Blend launch",   aliases = ["Harvest Blend", "bag artwork", "bag proofs"] },
  { id = "refit",   name = "Wayfinding refit",       aliases = ["Wayfinding"] },
  { id = "roaster", name = "Sample roaster programme", aliases = ["roaster", "afterburner", "burner"] },
  { id = "cupping", name = "Cupping lab fit-out",    aliases = ["cupping"] },
  { id = "none",    name = "No project" },
]

[label_types.bearer]
title   = "Bearer"
choices = [
  { id = "roast",  name = "Tallowmere Coffee Roasting Co." },
  { id = "hold",   name = "Brackenridge Lane Holdings" },
  { id = "design", name = "Quillfeather Design Consultancy" },
  { id = "lab",    name = "Saltmarsh Cupping Lab" },
]

[label_types.treatment]
title   = "Treatment"
choices = [
  { id = "owner-paid",   name = "Owner-paid" },
  { id = "personal",     name = "Personal" },
  { id = "per-diem",     name = "Per diem" },
  { id = "intercompany", name = "Intercompany" },
  { id = "transfer",     name = "Transfer" },
  { id = "duplicate",    name = "Duplicate" },
  { id = "unknown",      name = "Unknown" },
]

[label_types.should_be_account]
title   = "Should-be account"
kind    = "account"        # choices come from the line's own org chart

[queue]
required  = ["project", "bearer", "treatment"]
threshold = 0.90

# Any alias of any project in the description sets that project.
[[rules]]
id = "r-project-alias"
priority = 100
when = { description_has_alias = "project" }
set = { project = "$matched" }
confidence = 0.95

[[rules]]
id = "r-hollowpine"
priority = 90
when = { payee = "Hollowpine Packaging Works" }
set = { bearer = "roast", treatment = "intercompany" }
confidence = 0.92

[[rules]]
id = "r-intragroup"
priority = 80
when = { description_has = ["term loan", "management fee", "interest", "recharge"] }
set = { project = "none", treatment = "intercompany" }
confidence = 0.97

[[rules]]
id = "r-wholesale"
priority = 70
when = { account_in = ["4010"], sign = "in" }
set = { project = "none", bearer = "roast" }
confidence = 0.91

[[rules]]
id = "r-fuel"
priority = 60
when = { payee_has = ["fuel"] }
set = { project = "none", treatment = "personal" }
confidence = 0.55

[[rules]]
id = "r-emberline-split"
priority = 50
when = { payee = "Emberline Thermal Services" }
set = { group_kind = "split" }

[[rules]]
id = "r-bearer-roast"
priority = 10
when = { org_in = ["roast"] }
set = { bearer = "roast" }
confidence = 0.80

[[rules]]
id = "r-bearer-hold"
priority = 10
when = { org_in = ["hold"] }
set = { bearer = "hold" }
confidence = 0.80

[[rules]]
id = "r-bearer-design"
priority = 10
when = { org_in = ["design"] }
set = { bearer = "design" }
confidence = 0.80

[[rules]]
id = "r-bearer-lab"
priority = 10
when = { org_in = ["lab"] }
set = { bearer = "lab" }
confidence = 0.80

# Retired: kept for history (archived, never deleted).
[[rules]]
id = "r-registry-owner"
priority = 40
when = { payee = "Corvid Registry Services" }
set = { treatment = "owner-paid" }
archived = true

[tree]                     # read and validated only; Jev is not enabled in this release
root = "n-business"

[tree.nodes.n-business]
type = "noul"
instructions = "Was this payment made for one of the group's businesses rather than for someone personally?"
criteria = { true = "Clearly a business cost", false = "Clearly personal" }
yes = "n-project"
no = { set = { treatment = "personal" } }
auto = 0.90
queue_below = 0.50

[tree.nodes.n-project]
type = "choice"
instructions = "Which project does this payment belong to?"
criteria = { harvest = "The Harvest Blend launch", refit = "The wayfinding refit", none = "None of these" }
branches = { harvest = { set = { bearer = "roast" } }, refit = { set = { bearer = "design" } }, none = { queue = true } }
auto = 0.85
queue_below = 0.50

[groups]                   # group kinds only; group instances live in the store
kinds = ["intercompany_chain", "split", "trip", "accountant_question", "owner_paid", "settlement"]
roles = ["origin", "mirror", "settlement"]

# The term loan: Brackenridge's receivable 1460 against Tallowmere's loan 2410 (a + b = 0).
[groups.pair_rules.hold-roast-loan]
title = "Term loan: Brackenridge 1460 = Tallowmere 2410"
a = { org = "hold", plus = ["1460"] }
b = { org = "roast", plus = ["2410-2419"] }
sign = "opposite"
